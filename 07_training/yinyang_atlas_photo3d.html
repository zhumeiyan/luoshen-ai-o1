<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>洛神 ATLAS — Photo to 3D World Model</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;width:100vw;height:100vh}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:10}
.panel{background:rgba(6,10,22,.88);border:1px solid rgba(80,120,200,.25);border-radius:8px;backdrop-filter:blur(8px)}
.hdr{font-size:9.5px;color:#0f8;letter-spacing:1.5px;text-transform:uppercase;padding:7px 10px;border-bottom:1px solid rgba(80,120,200,.2);font-weight:600}
.pointer{pointer-events:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ============================================================
//  洛神 ATLAS — Photo→3D World Model Pipeline
//  输入照片 → 深度估计 → 点云重建 → 神经渲染 → 可漫游场景
// ============================================================
const cv=document.getElementById('c'),X=cv.getContext('2d');
let W=cv.width=innerWidth,H=cv.height=innerHeight;
addEventListener('resize',()=>{W=cv.width=innerWidth;H=cv.height=innerHeight});

let stage=0; // 0=input, 1=depth, 2=reconstruct, 3=render
let stageTimer=0;
let inputPhotos=[];
let reconstructedScene=null;
let cam={x:0,y:-180,z:200,angle:0,pitch:-.38};
let navCam={x:0,y:-400,z:0,angle:0,targetAngle:0,targetX:0,targetY:0};
let hoverAuto=true;
let particles=[];
let pointCloud=[];
let sceneObjects=[];

const COL=['#4488ff','#ff6b6b','#6bcf7f','#ffd93d','#cc99ff','#ff88aa','#00cccc','#ff8800'];

// ============================================================
//  STAGE 0: Photo Input — simulate selecting reference photos
// ============================================================
function generatePhoto(id){
  // Generate a procedural "photo" (scene from known camera angle)
  const c=document.createElement('canvas');c.width=160;c.height=120;
  const cx=c.getContext('2d');
  // Sky gradient
  let sky=cx.createLinearGradient(0,0,0,120);
  sky.addColorStop(0,'#1a2848');sky.addColorStop(.65,'#0d1428');sky.addColorStop(1,'#080c18');
  cx.fillStyle=sky;cx.fillRect(0,0,160,120);
  // Floor
  cx.fillStyle='#0a0e1a';cx.beginPath();cx.moveTo(0,85);cx.lineTo(160,85);cx.lineTo(160,120);cx.lineTo(0,120);cx.fill();
  // Ground grid lines
  cx.strokeStyle='rgba(40,60,120,0.3)';cx.lineWidth=.5;
  for(let i=0;i<8;i++){let y=85+i*5;cx.beginPath();cx.moveTo(0,y);cx.lineTo(160,y);cx.stroke()}
  for(let i=0;i<10;i++){let x=16+i*14;cx.beginPath();cx.moveTo(x,85);cx.lineTo(x+((i-5)*3),120);cx.stroke()}
  // Scene objects depend on id — different photos show different view
  let camAngle=id*Math.PI*.7;
  let objDefs=[
    {x:80+Math.cos(camAngle)*40,y:60+Math.sin(camAngle*.5)*10,r:14,col:COL[0]},
    {x:50+Math.cos(camAngle+2.1)*30,y:65+Math.sin(camAngle)*8,r:11,col:COL[1]},
    {x:110+Math.cos(camAngle+4)*25,y:55+Math.sin(camAngle+1)*12,r:12,col:COL[2]},
    {x:70+Math.sin(camAngle+1)*35,y:70+Math.cos(camAngle)*6,r:10,col:COL[3]}
  ];
  // Sort by depth for proper occlusion
  objDefs.sort((a,b)=>{return (Math.sin(camAngle)*a.y)-(Math.sin(camAngle)*b.y)});
  for(const o of objDefs){
    // shadow
    cx.fillStyle='rgba(0,0,0,.4)';
    cx.beginPath();cx.ellipse(o.x,o.y+o.r*.9,o.r*.7,o.r*.12,0,0,7);cx.fill();
    // ball
    let g=cx.createRadialGradient(o.x-o.r*.3,o.y-o.r*.3,o.r*.1,o.x,o.y,o.r);
    g.addColorStop(0,'#fff');g.addColorStop(.3,o.col);g.addColorStop(1,'rgba(0,0,0,.7)');
    cx.fillStyle=g;cx.beginPath();cx.arc(o.x,o.y,o.r,0,7);cx.fill();
    // specular
    cx.fillStyle='rgba(255,255,255,.5)';
    cx.beginPath();cx.arc(o.x-o.r*.3,o.y-.3,o.r*.25,0,7);cx.fill();
  }
  // Photo frame
  cx.strokeStyle='rgba(255,255,255,.15)';cx.lineWidth=2;cx.strokeRect(1,1,158,118);
  cx.fillStyle='rgba(0,0,0,.4)';cx.fillRect(5,98,40,16);
  cx.fillStyle='#aaa';cx.font='9px monospace';cx.fillText('VIEW_0'+(id+1),9,109);
  return {canvas:c,angle:camAngle,objects:objDefs,id};
}

function initPhotos(){
  inputPhotos=[generatePhoto(0),generatePhoto(1),generatePhoto(2),generatePhoto(3)];
}

function drawInputStage(t){
  let g=X.createRadialGradient(W/2,H*.4,40,W/2,H*0.5,W*1.3);
  g.addColorStop(0,'#0e1328');g.addColorStop(.6,'#080c1a');g.addColorStop(1,'#03050d');
  X.fillStyle=g;X.fillRect(0,0,W,H);

  // Title
  X.fillStyle='#fff';X.font='300 24px system-ui';X.fillText('Photo to 3D World Reconstruction',W/2-180,50);
  X.fillStyle='#0f8';X.font='600 14px system-ui';X.fillText('ATLAS',W/2+148,50);
  X.fillStyle='#555';X.font='10px system-ui';X.fillText('Sparse Photos → Dense 3D Scene → Persistent Spatial Memory',W/2-140,72);

  // Photo cards
  let cw=170,ch=130,gap=16;
  let totalW=inputPhotos.length*(cw+gap)-gap;
  let sx=(W-totalW)/2;
  let sy=H*.17;
  for(let i=0;i<inputPhotos.length;i++){
    let px=sx+i*(cw+gap),py=sy;
    // Card glow (pulsing)
    let pulse=Math.sin(t*.003+i*1.2)*.15+.85;
    X.shadowColor=`rgba(0,255,136,${.15*pulse})`;
    X.shadowBlur=12;
    X.fillStyle='rgba(10,15,30,.9)';
    X.fillRect(px-4,py-4,cw+8,ch+24);
    X.shadowBlur=0;
    // Photo
    X.drawImage(inputPhotos[i].canvas,px,py,cw,ch);
    // Label
    X.fillStyle='#0f8';X.font='10px monospace';
    X.fillText('INPUT_0'+(i+1),px+4,py+ch+14);
    X.fillStyle='#666';X.font='8px monospace';
    X.fillText(`θ=${(inputPhotos[i].angle*180/Math.PI|0)}°`,px+cw-44,py+ch+14);
  }

  // Arrow / progress
  let arrowY=H*.62;
  X.strokeStyle='rgba(0,255,136,.4)';X.lineWidth=2;X.setLineDash([6,4]);
  let prog=Math.min(1,(stageTimer%4000)/3000);
  let ax=sx-40, bx=sx+totalW+20;
  X.beginPath();X.moveTo(ax,arrowY);X.lineTo(ax+(bx-ax)*prog,arrowY);X.stroke();
  X.setLineDash([]);
  // Arrowhead
  X.fillStyle='rgba(0,255,136,.6)';
  X.beginPath();X.moveTo(bx,arrowY);X.lineTo(bx-10,arrowY-5);X.lineTo(bx-10,arrowY+5);X.fill();

  // Status
  X.fillStyle='rgba(255,255,255,.5)';X.font='12px system-ui';
  let status=['Analyzing photos...','Estimating depth maps...','Reconstructing point cloud...','Building neural scene...'];
  X.fillText(status[Math.floor(stageTimer/1000)%4],W/2-70,arrowY-15);

  // Camera poses visualization
  let cpX=W/2,cpY=H*.78,cpR=Math.min(W*.25,H*.14);
  X.strokeStyle='rgba(60,90,160,.4)';X.lineWidth=1;X.beginPath();X.arc(cpX,cpY,cpR,0,7);X.stroke();
  // camera frustums
  for(let i=0;i<inputPhotos.length;i++){
    let a=inputPhotos[i].angle;
    let cx=cpX+Math.cos(a)*cpR*.7, cy=cpY+Math.sin(a)*cpR*.4;
    X.fillStyle=COL[i];
    X.beginPath();X.arc(cx,cy,5,0,7);X.fill();
    // View direction arrow
    X.strokeStyle=COL[i];X.lineWidth=1.5;
    X.beginPath();X.moveTo(cx,cy);X.lineTo(cx+Math.cos(a)*20,cy+Math.sin(a)*12);X.stroke();
  }
  X.fillStyle='rgba(255,255,255,.4)';X.font='9px monospace';
  X.fillText('Camera Pose Estimation',cpX-55,cpY+cpR+15);
}

// ============================================================
//  STAGE 1: Depth Estimation — show depth map for each photo
// ============================================================
function drawDepthStage(t){
  let g=X.createRadialGradient(W/2,H*.4,40,W/2,H*0.5,W*1.3);
  g.addColorStop(0,'#101830');g.addColorStop(.6,'#0a1024');g.addColorStop(1,'#040812');
  X.fillStyle=g;X.fillRect(0,0,W,H);

  X.fillStyle='#fff';X.font='300 22px system-ui';X.fillText('Depth Estimation',W/2-80,48);
  X.fillStyle='#0f8';X.font='11px system-ui';
  X.fillText('Monocular Depth + Multi-View Consistency',W/2-100,68);

  let cellsPerRow=2;
  let cw=Math.min(360,W*.42),ch=cw*.8;
  let gap=10;
  let totalW=cellsPerRow*(cw+gap)-gap;
  let sx=(W-totalW)/2;
  let sy=H*.13;

  for(let i=0;i<Math.min(inputPhotos.length,4);i++){
    let row=Math.floor(i/cellsPerRow),col=i%cellsPerRow;
    let px=sx+col*(cw+gap),py=sy+row*(ch+gap+10);
    // Border
    X.strokeStyle='rgba(80,120,200,.3)';X.lineWidth=1;X.strokeRect(px-2,py-2,cw+4,ch+4);
    // Draw depth map — grayscale representing distance
    for(let dy=0;dy<ch;dy+=3){
      for(let dx=0;dx<cw;dx+=3){
        let wx=dx+cw*.2,wy=dy;
        // Simulate depth from known scene
        let depth=.5+.3*Math.sin((dx+dy)*.04+i*2);
        // Objects are closer (darker in depth convention)
        for(const obj of inputPhotos[i].objects){
          let ox=obj.x*(cw/160),oy=obj.y*(ch/120);
          let dist=Math.hypot(dx-ox,dy-oy);
          if(dist<obj.r*(cw/160)){
            depth*=.4+.6*(dist/(obj.r*(cw/160)));
          }
        }
        let v=Math.max(0,Math.min(255,depth*200));
        X.fillStyle=`rgb(${v},${v+10},${v+25})`;
        X.fillRect(px+dx,py+dy,3,3);
      }
    }
    X.fillStyle='#0f8';X.font='9px monospace';
    X.fillText('DEPTH_0'+(i+1),px+3,py+ch+12);
    // Confidence bar
    let conf=.85+Math.sin(t*.002+i)*.1;
    X.fillStyle='rgba(255,255,255,.1)';X.fillRect(px,py+ch+16,cw,4);
    X.fillStyle='#0f8';X.fillRect(px,py+ch+16,cw*conf,4);
  }

  // Progress indicator
  let prog=Math.min(1,(stageTimer%4500)/3500);
  X.fillStyle='rgba(255,255,255,.4)';X.font='10px monospace';
  X.fillText(`[Multi-View Fusion ${(prog*100)|0}%]`,W/2-60,H-30);
  X.fillStyle='rgba(255,255,255,.08)';X.fillRect(W*.25,H-22,W*.5,3);
  let grd=X.createLinearGradient(W*.25,0,W*.75,0);
  grd.addColorStop(0,'#0f8');grd.addColorStop(1,'#0cf');
  X.fillStyle=grd;X.fillRect(W*.25,H-22,W*.5*prog,3);
}

// ============================================================
//  STAGE 2: 3D Reconstruction — point cloud + mesh
// ============================================================
function initPointCloud(){
  pointCloud=[];
  for(const photo of inputPhotos){
    let camA=photo.angle;
    for(const obj of photo.objects){
      // Project to 3D from estimated depth
      let wx=obj.x-W/2,wy=obj.y-H/2;
      let worldX=Math.cos(camA)*wx*2;
      let worldZ=Math.sin(camA)*wx*2;
      let worldY=wy*1.5;
      let depth=200+obj.r*8;
      pointCloud.push({
        x:worldX,y:worldY,z:worldZ+depth,
        col:obj.col,life:1,brightness:.8+Math.random()*.2
      });
    }
  }
  // Add extra points to fill space (sparse reconstruction)
  for(let i=0;i<150;i++){
    pointCloud.push({
      x:(Math.random()-.5)*400,
      y:-Math.random()*150-20,
      z:Math.random()*300+100,
      col:COL[i%COL.length],
      life:.4+Math.random()*.6,
      brightness:.5+Math.random()*.3
    });
  }
}

function drawReconstructStage(t){
  X.fillStyle='#040812';X.fillRect(0,0,W,H);

  // Center the view
  let ox=W/2,oy=H*.6;
  X.save();
  X.translate(ox,oy);

  // Auto-rotating view
  let rot=t*.00008;

  // Sort points by depth
  let sorted=[...pointCloud].sort((a,b)=>{
    let az=a.z*Math.cos(rot)-a.x*Math.sin(rot);
    let bz=b.z*Math.cos(rot)-b.x*Math.sin(rot);
    return bz-az;
  });

  // Draw mesh lines between nearby points
  X.strokeStyle='rgba(40,80,160,.18)';X.lineWidth=.5;
  for(let i=0;i<sorted.length;i+=3){
    for(let j=i+1;j<sorted.length;j+=5){
      let d=Math.hypot(sorted[i].x-sorted[j].x,sorted[i].y-sorted[j].y,sorted[i].z-sorted[j].z);
      if(d<80){
        let pi=sorted[i],pj=sorted[j];
        let six=pi.x*Math.cos(rot)+pi.z*Math.sin(rot);
        let siy=-pi.y;
        let siz=pi.z*Math.cos(rot)-pi.x*Math.sin(rot)+300;
        let pjx=pj.x*Math.cos(rot)+pj.z*Math.sin(rot);
        let pjy=-pj.y;
        let pjz=pj.z*Math.cos(rot)-pj.x*Math.sin(rot)+300;
        let scale=400/(siz+400);
        let scale2=400/(pjz+400);
        X.beginPath();
        X.moveTo(six*scale,siy*scale);
        X.lineTo(pjx*scale2,pjy*scale2);
        X.stroke();
      }
    }
  }

  // Draw points
  for(const p of sorted){
    let sx=p.x*Math.cos(rot)+p.z*Math.sin(rot);
    let sy=-p.y;
    let sz=p.z*Math.cos(rot)-p.x*Math.sin(rot)+300;
    let scale=400/(sz+400);
    let size=(2+p.life*4)*scale;
    X.fillStyle=p.col;
    X.globalAlpha=p.brightness*scale;
    X.beginPath();X.arc(sx*scale,sy*scale,size,0,7);X.fill();
  }
  X.globalAlpha=1;
  X.restore();

  // Title overlay
  X.fillStyle='rgba(0,0,0,.7)';X.fillRect(0,0,W,80);
  X.fillStyle='#fff';X.font='300 22px system-ui';X.fillText('3D Gaussian Splatting Reconstruction',20,38);
  X.fillStyle='#0f8';X.font='11px system-ui';
  X.fillText(`${pointCloud.length} gaussians · Multi-View Stereo + Neural Rendering`,20,60);

  // Progress
  let prog=Math.min(1,(stageTime%9000)/7000);
  X.fillStyle='rgba(255,255,255,.4)';X.font='10px monospace';
  X.fillText(`[Spatial Memory Formation ${(prog*100)|0}%]`,W-180,38);
  X.fillStyle='rgba(255,255,255,.08)';X.fillRect(W*.3,H-22,W*.4,3);
  X.fillStyle='#0f8';X.fillRect(W*.3,H-22,W*.4*prog,3);
}

// ============================================================
//  STAGE 3: Neural Render — the final photorealistic view
// ============================================================
function drawRenderStage(t){
  let g=X.createRadialGradient(W/2,H*.4,80,W/2,H*.45,W*1.2);
  g.addColorStop(0,'#0d1428');g.addColorStop(.6,'#080c1a');g.addColorStop(1,'#03050d');
  X.fillStyle=g;X.fillRect(0,0,W,H);

  // Navigate camera (auto-orbit with smoothness)
  navCam.angle+=(navCam.targetAngle-navCam.angle)*.02;
  if(hoverAuto&&t*.00007<navCam.targetAngle+.01) navCam.targetAngle=t*.00007;

  // Draw floor grid with perspective
  let rows=15,cols=8,cell=65,yFloor=H*.72;
  for(let r=0;r<rows;r++){
    for(let c=-cols/2;c<cols/2;c++){
      let wx=c*cell,wz=r*cell+50;
      // Rotate around Y axis
      let cosA=Math.cos(navCam.angle),sinA=Math.sin(navCam.angle);
      let rx=wx*cosA+wz*sinA;
      let rz=-wx*sinA+wz*cosA+250;
      if(rz<10)continue;
      let scale=400/rz;
      let sx=W/2+rx*scale;
      let sy=yFloor-scale*25;
      if(sx<-200||sx>W+200)continue;
      let isC=(c+r)&1;
      // Darker with distance
      let fade=Math.max(.3,1-r/rows);
      X.fillStyle=isC?`rgba(22,32,60,${fade*.6})`:`rgba(16,24,48,${fade*.6})`;
      X.fillRect(sx-cell*scale*.5,sy-cell*scale*.25,cell*scale,cell*scale*.5);
    }
  }

  // Scene objects (the reconstructed scene)
  // Objects are at known positions from the point cloud
  let objects=sceneObjects;
  if(!objects||objects.length===0){
    objects=[
      {x:-120,z:150,r:26,col:COL[0]},
      {x:80,z:200,r:22,col:COL[1]},
      {x:-40,z:100,r:28,col:COL[2]},
      {x:140,z:120,r:24,col:COL[3]}
    ];
  }
  // Sort by depth
  let renderList=objects.map(o=>{
    let dx=o.x-cam.x,dz=o.z+250-cam.z;
    let cosA=Math.cos(navCam.angle),sinA=Math.sin(navCam.angle);
    let rx=dx*cosA+dz*sinA;
    let rz=-dx*sinA+dz*cosA+250;
    let ry=-(o.y||-60);
    let scale=400/(rz+10);
    let sx=W/2+rx*scale;
    let sy=yFloor+ry*scale;
    return {sx,sy,scale,rz,col:o.col,r:o.r,id:o.id||'mesh',occ:o.occ};
  });
  renderList.sort((a,b)=>b.rz-a.rz);

  for(const o of renderList){
    if(o.rz<10)continue;
    let sr=o.r*o.scale;
    // Shadow
    X.fillStyle='rgba(0,0,0,0.35)';
    X.beginPath();X.ellipse(o.sx,yFloor+8,sr*.8,sr*.14,0,0,7);X.fill();
    // Ball
    if(o.occ){
      // Occluded: memory tracking
      X.strokeStyle='rgba(255,210,60,.85)';X.lineWidth=2;X.setLineDash([5,4]);
      X.beginPath();X.arc(o.sx,o.sy,sr+3,0,7);X.stroke();X.setLineDash([]);
      X.fillStyle='#ffd93d';X.font='bold 12px system-ui';X.fillText('\\uD83E\\uDDE0 MEMORY',o.sx-35,o.sy-sr-7);
    } else {
      // PBR ball (simplified)
      let baseCol=o.col;
      let g2=X.createRadialGradient(o.sx-sr*.25,o.sy-sr*.2,sr*.05,o.sx,o.sy,sr);
      g2.addColorStop(0,'#fff');g2.addColorStop(.3,baseCol);g2.addColorStop(1,'rgba(0,0,0,.6)');
      X.fillStyle=g2;X.beginPath();X.arc(o.sx,o.sy,sr,0,7);X.fill();
      // Specular
      X.fillStyle='rgba(255,255,255,.4)';
      X.beginPath();X.arc(o.sx-sr*.3,o.y-.25,sr*.2,0,7);X.fill();
      // Fresnel
      let rg=X.createRadialGradient(o.sx,o.sy,sr*.75,o.sx,o.sy,sr);
      rg.addColorStop(0,'rgba(255,255,255,0)');
      rg.addColorStop(.85,'rgba(255,255,255,0)');
      rg.addColorStop(1,'rgba(220,240,255,.15)');
      X.fillStyle=rg;X.beginPath();X.arc(o.sx,o.sy,sr,0,7);X.fill();
      // Label
      X.fillStyle='rgba(255,255,255,.6)';X.font='9px monospace';
      X.fillText(o.id||'mesh',o.sx-10,o.sy-sr-6);
    }
  }

  // Scene persistence indicator
  X.fillStyle='rgba(0,255,136,.7)';X.font='10px monospace';
  X.fillText('⚡ Spatial Memory: ACTIVE · 8 objects reconstructed',15,H-25);

  // Confidence confidence (quality) indicator
  X.fillStyle='rgba(255,255,255,.4)';X.font='9px monospace';
  X.fillText(`View: ${(navCam.angle*180/Math.PI|0)}° · Confidence: ${(92+Math.sin(t*.001)*4).toFixed(1)}%`,W-220,H-25);
}

// ============================================================
//  Main animation loop — cycle through 4 stages
// ============================================================
function updateScene() {
  // Let's jump to render stage directly after a brief intro, and also
  // maintain the reconstructed point cloud/render objects.
  if(stage===0&&stageTimer>5000){
    stage=1;stageTimer=0;
  }
  if(stage===1&&stageTimer>5000){
    stage=2;stageTimer=0;initPointCloud();
  }
  if(stage===2&&stageTimer>5000){
    stage=3;stageTimer=0;
    // Build persistent scene from point cloud
    sceneObjects=[
      {x:-120,z:150,r:26,col:COL[0],id:'obj-A'},
      {x:80,z:200,r:22,col:COL[1],id:'obj-B'},
      {x:-40,z:100,r:28,col:COL[2],id:'obj-C'},
      {x:140,z:120,r:24,col:COL[3],id:'obj-D'},
      {x:-170,z:250,r:20,col:COL[4],id:'obj-E'},
      {x:30,z:180,r:19,col:COL[5],id:'obj-F'}
    ];
  }
}

function loop(t){
  if(play)stageTimer+=16;
  updateScene();

  switch(stage){
    case 0:drawInputStage(t);break;
    case 1:drawDepthStage(t);break;
    case 2:drawReconstructStage(t);break;
    case 3:drawRenderStage(t);break;
  }
  requestAnimationFrame(loop);
}

initPhotos();
loop(0);

// Expose for control
window.__demo={};
</script>
</body>
</html>
