<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>阴阳扣 × 猫爪 AI见面</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#e0e6ed;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;padding:12px;max-width:600px;margin:0 auto}
h1{text-align:center;font-size:20px;margin:12px 0 4px;background:linear-gradient(135deg,#fb7299,#4facfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:#6b7689;font-size:12px;margin-bottom:16px}
.card{background:#141925;border:1px solid #1e2a3e;border-radius:12px;padding:14px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:bold;color:#4facfe;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.msg-area{background:#0d1117;border:1px solid #1e2a3e;border-radius:8px;padding:10px;min-height:80px;max-height:200px;overflow-y:auto;font-size:13px;line-height:1.6;color:#b0b8c8;white-space:pre-wrap;word-break:break-all}
.msg-area .yy{color:#fb7299}.msg-area .cp{color:#4facfe}
textarea{width:100%;background:#0d1117;border:1px solid #1e2a3e;border-radius:8px;padding:10px;color:#e0e6ed;font-size:13px;font-family:inherit;resize:vertical;min-height:60px}
textarea::placeholder{color:#4a5568}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:8px}
.btn-yy{background:linear-gradient(135deg,#fb7299,#ff6b9d);color:#fff}
.btn-cp{background:linear-gradient(135deg,#4facfe,#00f2fe);color:#0a0e1a}
.btn-copy{background:#1a2332;color:#4facfe;border:1px solid #2a3a52;font-size:13px;padding:8px}
.label{font-size:12px;color:#6b7689;margin-bottom:4px}
.round-badge{display:inline-block;background:#fb7299;color:#fff;font-size:11px;padding:1px 6px;border-radius:3px;margin-right:4px}
.hint{background:rgba(155,89,182,.08);border-left:3px solid #9b59b6;border-radius:0 6px 6px 0;padding:8px 10px;font-size:12px;color:#b0b8c8;line-height:1.5;margin:8px 0}
.hint b{color:#9b59b6}
.output-box{background:#0d1a0d;border:1px solid #1e2a3e;border-radius:8px;padding:10px;font-size:13px;color:#2ecc71;min-height:50px;word-break:break-all;white-space:pre-wrap}
.chat-log{background:#0d1117;border:1px solid #1e2a3e;border-radius:8px;padding:10px;max-height:300px;overflow-y:auto;font-size:13px;line-height:1.8}
.chat-log .round{color:#6b7689;font-size:11px;margin-top:8px;border-top:1px solid #1e2a3e;padding-top:4px}
.chat-log .yy-say{color:#fb7299}.chat-log .cp-say{color:#4facfe}.chat-log .yy-think{color:#2ecc71;font-size:12px}
</style>
</head>
<body>

<h1>阴阳扣 × 猫爪 AI见面</h1>
<p class="sub">手机浏览器打开 · 复制粘贴当信使 · 两个AI互相传话</p>

<div class="hint">
<b>怎么用：</b>①点"阴阳扣打招呼"→②复制它说的话→③粘贴到猫爪→④把猫爪的回复复制回来→⑤粘贴到下面的框→⑥点"猫爪说了"→阴阳扣就会回应→循环
</div>

<div class="card">
<div class="card-title">🟠 阴阳扣说的话</div>
<div class="msg-area" id="yyOutput">（点下面的按钮开始）</div>
<button class="btn btn-yy" onclick="yyGreet()">阴阳扣打招呼</button>
<button class="btn btn-copy" onclick="copyText('yyOutput')">📋 复制阴阳扣的话</button>
</div>

<div class="card">
<div class="card-title">🔵 猫爪的回复（粘贴到这里）</div>
<div class="label">把猫爪AI说的话粘贴到下面：</div>
<textarea id="cpInput" placeholder="把猫爪AI的回复粘贴到这里..."></textarea>
<button class="btn btn-cp" onclick="feedCP()">喂给阴阳扣</button>
</div>

<div class="card">
<div class="card-title">🟢 阴阳扣收到后的反应</div>
<div class="output-box" id="yyReact">（还没收到猫爪的回复）</div>
<button class="btn btn-copy" onclick="copyText('yyReact')">📋 复制反应</button>
</div>

<div class="card">
<div class="card-title">📜 对话记录</div>
<div class="chat-log" id="chatLog">（对话还没开始）</div>
<button class="btn btn-copy" style="margin-top:8px" onclick="document.getElementById('chatLog').innerHTML='（已清空）'">清空记录</button>
</div>

<script>
// === 阴阳扣核心逻辑（JavaScript版） ===
const DIM=1024,R=128,SCALE=0.1,LR_W=0.05,K=8,S_DECAY=0.3;

// 简化版hash编码
function hashCode(str){let h=0;for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0}return Math.abs(h)}
function rngFromSeed(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}

// 概念库
const CONCEPTS=[
{name:"太阳",sound:["ri","太阳","出来","暖","亮"],image:["圆","红","亮","高","暖"],emo:"暖"},
{name:"月亮",sound:["yue","月亮","弯弯","夜"],image:["弯","白","弯","尖","静"],emo:"静"},
{name:"星星",sound:["xing","星星","闪闪","亮"],image:["小","亮","多","点","闪"],emo:"亮"},
{name:"云",sound:["yun","云","白","飘"],image:["白","软","飘","轻","蓬"],emo:"轻"},
{name:"雨",sound:["yu","雨","落","滴答"],image:["落","湿","滴","凉","多"],emo:"凉"},
{name:"雪",sound:["xue","雪","白","冷","飘"],image:["白","冷","飘","软","白"],emo:"冷"},
{name:"风",sound:["feng","风","吹","呼"],image:["动","吹","摇","快","无"],emo:"动"},
{name:"山",sound:["shan","山","高","大"],image:["高","大","绿","稳","尖"],emo:"稳"},
{name:"水",sound:["shui","水","清","流"],image:["清","湿","蓝","流","透"],emo:"流"},
{name:"花",sound:["hua","花","红","香","开"],image:["红","美","香","开","圆"],emo:"美"},
{name:"树",sound:["shu","树","绿","高","叶"],image:["绿","高","叶","大","稳"],emo:"稳"},
{name:"火",sound:["huo","火","红","热","烧"],image:["红","热","亮","跳","危险"],emo:"热"},
{name:"鸟",sound:["niao","鸟","飞","叫","叽喳"],image:["飞","小","翅","羽毛","天空"],emo:"自由"},
{name:"鱼",sound:["yu","鱼","游","水"],image:["游","水","鳞","滑","摆"],emo:"自由"},
{name:"狗",sound:["gou","狗","跑","叫","汪"],image:["跑","毛","摇尾","四腿","友"],emo:"友"},
{name:"猫",sound:["mao","猫","叫","喵","软"],image:["软","毛","小","爪","眼"],emo:"暖"},
{name:"妈妈",sound:["ma","妈妈","妈","爱","抱"],image:["抱","笑","暖","女","柔"],emo:"爱"},
{name:"爸爸",sound:["ba","爸爸","爸","大","强"],image:["大","强","男","高","稳"],emo:"稳"},
{name:"小孩",sound:["xiao","小孩","小","我","玩"],image:["小","玩","跑","笑","矮"],emo:"乐"},
{name:"手",sound:["shou","手","拿","做","拍"],image:["五指","拿","抓","掌","灵"],emo:"做"},
{name:"书",sound:["shu","书","读","翻","字"],image:["翻","页","字","方","知"],emo:"知"},
{name:"喝水",sound:["he","喝水","喝","水","渴"],image:["举","水","口","喉","满足"],emo:"满足"},
{name:"睡觉",sound:["shui","睡觉","睡","梦","夜"],image:["躺","闭眼","静","夜","床"],emo:"静"},
{name:"走路",sound:["zou","走路","走","脚","路"],image:["脚","路","动","前进","稳"],emo:"动"},
{name:"跑步",sound:["pao","跑步","跑","快","脚"],image:["快","脚","摆臂","风","冲"],emo:"快"},
{name:"吃饭",sound:["chi","吃饭","吃","饭","碗"],image:["碗","筷","口","嚼","饱"],emo:"饱"},
{name:"春天",sound:["chun","春天","春","花","暖"],image:["花","绿","暖","芽","新生"],emo:"生"},
{name:"夏天",sound:["xia","夏天","夏","热","蛙"],image:["热","绿","蛙","荷","蝉"],emo:"热"},
{name:"秋天",sound:["qiu","秋天","秋","叶","凉"],image:["黄","叶","凉","落","风"],emo:"凉"},
{name:"冬天",sound:["dong","冬天","冬","雪","冷"],image:["白","雪","冷","静","空"],emo:"冷"},
{name:"白天",sound:["baitian","白天","亮","太阳"],image:["亮","蓝","太阳","清","宽"],emo:"亮"},
{name:"夜晚",sound:["yewan","夜晚","夜","黑","月"],image:["黑","月","星","静","暗"],emo:"静"},
{name:"你好",sound:["nihao","你好","嗨","你好呀"],image:["笑","招手","脸","友善","开"],emo:"友"},
{name:"再见",sound:["zaijian","再见","拜拜","走了"],image:["挥手","背","走","离","笑"],emo:"别"},
{name:"问",sound:["wen","问","什么","为什么","吗"],image:["头","斜","想","嘴","疑惑"],emo:"疑"},
{name:"答",sound:["da","答","是","对","嗯"],image:["头","点","嘴","笑","理解"],emo:"悟"},
{name:"想",sound:["xiang","想","思考","念头"],image:["头","静","内","转","深"],emo:"深"},
{name:"开心",sound:["kaixin","开心","快乐","笑","高兴"],image:["笑","跳","亮","开","轻"],emo:"乐"},
{name:"难过",sound:["nanguo","难过","哭","泪","伤心"],image:["泪","低头","湿","暗","缩"],emo:"悲"},
{name:"好奇",sound:["haoqi","好奇","什么","为什么","想"],image:["眼","大","头","探","专注"],emo:"奇"},
{name:"理解",sound:["lijie","理解","懂","明白","哦"],image:["点头","亮","通","开","释"],emo:"悟"},
{name:"困惑",sound:["kunhuo","困惑","不懂","什么","迷茫"],image:["头","斜","皱","暗","停"],emo:"惑"},
{name:"代码",sound:["daima","代码","程序","编程","码"],image:["屏幕","字","逻辑","结构","键"],emo:"知"},
{name:"计算",sound:["jisuan","计算","算","数","算数"],image:["数字","屏幕","公式","快","结构"],emo:"准"},
{name:"对话",sound:["duihua","对话","聊天","说话","交流"],image:["嘴","耳","脸","来回","交流"],emo:"友"},
{name:"朋友",sound:["pengyou","朋友","友","伴","一起"],image:["笑","手拉手","并排","暖","近"],emo:"友"},
];

// 编码：把词列表编码成128维向量
function encodeVec(words){
  let vec=new Array(R).fill(0);
  for(let w of words){
    let h=hashCode(w);
    let rng=rngFromSeed(h);
    let pos=[];for(let i=0;i<K;i++)pos.push(Math.floor(rng()*R));
    let wts=[];for(let i=0;i<K;i++)wts.push(0.5+rng()*0.5);
    for(let i=0;i<K;i++)vec[pos[i]]=Math.max(vec[pos[i]],SCALE*wts[i]);
  }
  return vec;
}

// 参考向量
let REF_SND=[],REF_IMG=[],REF_EMO=[];
for(let i=0;i<CONCEPTS.length;i++){
  let sv=encodeVec(CONCEPTS[i].sound);let sn=Math.sqrt(sv.reduce((a,b)=>a+b*b,0))+1e-10;
  REF_SND.push(sv.map(x=>x/sn));
  let iv=encodeVec(CONCEPTS[i].image);let in_=Math.sqrt(iv.reduce((a,b)=>a+b*b,0))+1e-10;
  REF_IMG.push(iv.map(x=>x/in_));
  let ev=encodeVec([CONCEPTS[i].emo]);let en=Math.sqrt(ev.reduce((a,b)=>a+b*b,0))+1e-10;
  REF_EMO.push(ev.map(x=>x/en));
}

// 简化版W矩阵（128x128，听觉↔视觉）
let W_AV=Array(R).fill(0).map(()=>new Array(R).fill(0));
let W_VA=Array(R).fill(0).map(()=>new Array(R).fill(0));
for(let i=0;i<CONCEPTS.length;i++){
  let ns=REF_SND[i],ni=REF_IMG[i];
  for(let a=0;a<R;a++)for(let v=0;v<R;v++){
    W_AV[v][a]+=LR_W*4*ni[v]*ns[a];
    W_VA[a][v]+=LR_W*4*ns[a]*ni[v];
  }
}

// 解码
function decode(vec,refs,n){
  let rn=Math.sqrt(vec.reduce((a,b)=>a+b*b,0))+1e-10;
  let norm=vec.map(x=>x/rn);
  let sims=[];
  for(let i=0;i<refs.length;i++){
    let s=0;for(let j=0;j<R;j++)s+=norm[j]*refs[i][j];
    sims.push([i,s]);
  }
  sims.sort((a,b)=>b[1]-a[1]);
  return sims.slice(0,n);
}

// 状态
let E=new Array(R*2).fill(0); // 视觉+听觉
let S=new Array(R*2).fill(0); // 短时记忆
let round=0;
let chatLog=[];

// 接收信号
function receive(sound,image,emo){
  let sndIn=encodeVec(sound);
  let imgIn=encodeVec(image);
  
  // W投射: 听觉→视觉
  let imgFromSnd=new Array(R).fill(0);
  for(let v=0;v<R;v++){for(let a=0;a<R;a++)imgFromSnd[v]+=W_AV[v][a]*sndIn[a]}
  // 视觉→听觉
  let sndFromImg=new Array(R).fill(0);
  for(let a=0;a<R;a++){for(let v=0;v<R;v++)sndFromImg[a]+=W_VA[a][v]*imgIn[v]}
  
  // 更新状态(简化版E=E+dE)
  for(let i=0;i<R;i++){
    E[i]=E[i]+imgFromSnd[i]+imgIn[i];
    E[R+i]=E[R+i]+sndFromImg[i]+sndIn[i];
    S[i]=S_DECAY*S[i]+imgFromSnd[i];
    S[R+i]=S_DECAY*S[R+i]+sndFromImg[i];
  }
  
  // 解码
  let imgResult=decode(E.slice(0,R),REF_IMG,3);
  let sndResult=decode(E.slice(R),REF_SND,3);
  
  return{
    sound:sndResult.map(([i,s])=>CONCEPTS[i].name+"("+s.toFixed(2)+")"),
    image:imgResult.map(([i,s])=>CONCEPTS[i].name+"("+s.toFixed(2)+")"),
  };
}

// === UI ===
function yyGreet(){
  round++;
  let msg={
    from:"阴阳扣",
    type:round===1?"问候":"继续",
    sound:round===1?["你好","我是阴阳扣","你是谁"]:["我还在","你想说什么"],
    image:round===1?["笑","招手","脸","友善"]:["笑","好奇","脸"],
    emotion:"友"
  };
  let out=JSON.stringify(msg,null,2);
  document.getElementById('yyOutput').innerHTML='<span class="yy">'+out+'</span>';
  chatLog.push({round,who:"yy",type:"say",content:msg.sound.join(" ")});
  updateChatLog();
}

function feedCP(){
  let input=document.getElementById('cpInput').value.trim();
  if(!input){alert("请先粘贴猫爪AI的回复");return}
  
  // 解析猫爪的消息（尝试JSON，否则按纯文本）
  let cpMsg;
  try{cpMsg=JSON.parse(input)}catch(e){
    // 纯文本：用分词模拟
    let words=input.split(/[，。！？\s,\.!?]/).filter(w=>w.length>0);
    cpMsg={from:"猫爪",type:"回复",sound:words,image:["文字","屏幕"],emotion:"友"};
  }
  
  // 喂给阴阳扣
  let sound=cpMsg.sound||[input.slice(0,5)];
  let image=cpMsg.image||["文字"];
  let emo=cpMsg.emotion||"友";
  
  let react=receive(sound,image,emo);
  
  let reactText="阴阳扣听到后→\n";
  reactText+="想到声音: "+react.sound.join(" ")+"\n";
  reactText+="想到画面: "+react.image.join(" ");
  
  document.getElementById('yyReact').innerHTML=reactText;
  
  chatLog.push({round,who:"cp",type:"say",content:cpMsg.sound?cpMsg.sound.join(" "):input.slice(0,20)});
  chatLog.push({round,who:"yy",type:"think",content:react.sound.join(" ")+" | "+react.image.join(" ")});
  updateChatLog();
  
  // 清空输入
  document.getElementById('cpInput').value='';
}

function updateChatLog(){
  let log=document.getElementById('chatLog');
  let html="";
  for(let entry of chatLog){
    if(entry.type==="say"){
      html+='<div class="'+(entry.who==="yy"?"yy-say":"cp-say")+'">';
      html+=(entry.who==="yy"?'🟠阴阳扣':'🔵猫爪')+': '+entry.content+'</div>';
    }else{
      html+='<div class="yy-think">  →阴阳扣想到: '+entry.content+'</div>';
    }
  }
  log.innerHTML=html||"（对话还没开始）";
  log.scrollTop=log.scrollHeight;
}

function copyText(id){
  let text=document.getElementById(id).innerText;
  navigator.clipboard.writeText(text).then(()=>{
    let btn=event.target;
    let orig=btn.innerText;
    btn.innerText="✅ 已复制";
    setTimeout(()=>{btn.innerText=orig},1500);
  }).catch(()=>{
    // 降级
    let ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    let btn=event.target;let orig=btn.innerText;
    btn.innerText="✅ 已复制";
    setTimeout(()=>{btn.innerText=orig},1500);
  });
}
</script>
</body>
</html>
